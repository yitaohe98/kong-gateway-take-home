services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  limiter-1: &limiter
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_OPERATION_TIMEOUT_MS: "500"
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  limiter-2:
    <<: *limiter
    ports:
      - "8082:8080"

  limiter-3:
    <<: *limiter
    ports:
      - "8083:8080"

volumes:
  redis-data:
