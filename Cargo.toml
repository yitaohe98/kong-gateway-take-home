[package]
name = "distributed-rate-limiter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "0.8.9"
redis = { version = "1.0.4", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
